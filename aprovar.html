<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprovar conteúdo — Nera Digital</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f4f5f9;min-height:100vh;padding:40px 20px}
.wrap{max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:32px;border:1px solid #e0e2f0;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #e0e2f0}
.logo-mark{width:36px;height:36px;background:#5B5BD6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
.logo-name{font-size:14px;font-weight:600;color:#1a1060}
.title{font-size:20px;font-weight:600;color:#1a1060;margin-bottom:6px}
.sub{font-size:13px;color:#8888aa;margin-bottom:24px}
.doc-link{display:flex;align-items:center;gap:10px;background:#f0f1f8;border:1px solid #e0e2f0;border-radius:10px;padding:14px 16px;margin-bottom:20px;text-decoration:none;color:#5B5BD6;font-size:13px;font-weight:500;transition:background .15s}
.doc-link:hover{background:#e8eaf4}
.section-title{font-size:11px;font-weight:600;color:#8888aa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:#4a4a7a;margin-bottom:5px;font-weight:500}
.field input,.field textarea{width:100%;background:#f0f1f8;border:1px solid #e0e2f0;border-radius:10px;padding:10px 14px;font-size:13px;color:#1a1060;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus{border-color:#5B5BD6;box-shadow:0 0 0 3px rgba(91,91,214,.1)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}

/* Seletor de canal */
.canal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.canal-btn{border:1.5px solid #e0e2f0;border-radius:10px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .15s;background:#fff}
.canal-btn:hover{border-color:#c8cae8;background:#f0f1f8}
.canal-btn.on{border-color:#5B5BD6;background:rgba(91,91,214,.06)}
.canal-icon{font-size:20px;margin-bottom:4px}
.canal-name{font-size:12px;font-weight:500;color:#4a4a7a}
.canal-btn.on .canal-name{color:#5B5BD6}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-primary{background:#5B5BD6;color:#fff}
.btn-primary:hover{background:#4848b8}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:transparent;color:#4a4a7a;border:1px solid #e0e2f0;margin-top:8px}
.btn-secondary:hover{background:#f0f1f8}

.status-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
.status-bar.success{background:rgba(26,158,90,.08);color:#1a9e5a;border:1px solid rgba(26,158,90,.2)}
.status-bar.error{background:rgba(224,48,48,.08);color:#e03030;border:1px solid rgba(224,48,48,.2)}
.status-bar.info{background:rgba(91,91,214,.08);color:#5B5BD6;border:1px solid rgba(91,91,214,.2)}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-mark">N</div>
      <div class="logo-name">Nera Digital — Aprovação de conteúdo</div>
    </div>

    <div class="title">Aprovar e enviar ao cliente</div>
    <div class="sub" id="page-sub">Revise o conteúdo no Google Docs e escolha como enviar ao cliente.</div>

    <div id="status-wrap"></div>

    <a id="doc-link" href="#" target="_blank" class="doc-link">
      <span style="font-size:18px">📄</span>
      <span id="doc-link-text">Abrir Google Docs para revisar</span>
    </a>

    <div class="section-title">Dados do cliente</div>
    <div class="field">
      <label>Nome do cliente</label>
      <input type="text" id="cliente-nome" placeholder="Ex: Odontologia Sorrir">
    </div>
    <div class="field">
      <label>E-mail do cliente</label>
      <input type="email" id="cliente-email" placeholder="cliente@empresa.com.br">
    </div>
    <div class="field">
      <label>WhatsApp do cliente</label>
      <input type="text" id="cliente-wpp" placeholder="5511999990000 (com DDI)">
    </div>

    <div class="section-title" style="margin-top:20px">Como enviar ao cliente?</div>
    <div class="canal-grid">
      <div class="canal-btn" id="canal-email" onclick="toggleCanal('email')">
        <div class="canal-icon">✉️</div>
        <div class="canal-name">E-mail</div>
      </div>
      <div class="canal-btn" id="canal-wpp" onclick="toggleCanal('wpp')">
        <div class="canal-icon">💬</div>
        <div class="canal-name">WhatsApp</div>
      </div>
      <div class="canal-btn on" id="canal-ambos" onclick="toggleCanal('ambos')">
        <div class="canal-icon">✉️💬</div>
        <div class="canal-name">Os dois</div>
      </div>
    </div>

    <div class="section-title">Mensagem ao cliente</div>
    <div class="field">
      <textarea id="msg-cliente" rows="4">Olá! Os conteúdos da semana estão prontos para sua revisão.

Acesse o link abaixo para revisar e deixar seus comentários diretamente no documento:

{{LINK_DOCS}}

Qualquer dúvida, estamos à disposição!

Abraços,
Nera Digital</textarea>
    </div>

    <button class="btn btn-primary" id="btn-aprovar" onclick="aprovarEnviar()">
      <span id="btn-spinner" style="display:none" class="spinner"></span>
      <span id="btn-text">✅ Aprovar e enviar ao cliente</span>
    </button>
    <button class="btn btn-secondary" onclick="window.location='index.html'">Voltar ao gerador</button>
  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://dcsxhdqwdoxbwgokzlea.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjc3hoZHF3ZG94Yndnb2t6bGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3ODkxMTcsImV4cCI6MjA5MTM2NTExN30.StReq9QRsQ87OftrnVUSRIUKNjhXlZdLddx7HnlcB2E'
);

const PROXY = 'https://dcsxhdqwdoxbwgokzlea.supabase.co/functions/v1';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjc3hoZHF3ZG94Yndnb2t6bGVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3ODkxMTcsImV4cCI6MjA5MTM2NTExN30.StReq9QRsQ87OftrnVUSRIUKNjhXlZdLddx7HnlcB2E';

let canais = new Set(['ambos']);
let docUrl = '';
let semanaId = '';

window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  docUrl = params.get('doc') || '';
  semanaId = params.get('semana') || '';
  const cliente = params.get('cliente') || '';

  if (docUrl) {
    document.getElementById('doc-link').href = docUrl;
    document.getElementById('doc-link-text').textContent = 'Abrir Google Docs — ' + (cliente || 'conteúdo gerado');
  }

  if (cliente) {
    document.getElementById('cliente-nome').value = cliente;
    // Tentar carregar dados do cliente
    loadClienteData(cliente);
  }
};

async function loadClienteData(nome) {
  const { data } = await sb.from('clientes')
    .select('email, responsavel_tel, responsavel_email, telefone')
    .ilike('nome_negocio', '%' + nome + '%')
    .single();
  if (data) {
    document.getElementById('cliente-email').value = data.responsavel_email || data.email || '';
    document.getElementById('cliente-wpp').value = (data.responsavel_tel || data.telefone || '').replace(/\D/g, '');
  }
}

function toggleCanal(canal) {
  ['email', 'wpp', 'ambos'].forEach(c => {
    document.getElementById('canal-' + c).classList.remove('on');
  });
  canais.clear();
  canais.add(canal);
  document.getElementById('canal-' + canal).classList.add('on');
}

function showStatus(msg, type) {
  document.getElementById('status-wrap').innerHTML =
    '<div class="status-bar ' + type + '">' + msg + '</div>';
}

async function aprovarEnviar() {
  const email = document.getElementById('cliente-email').value.trim();
  const wpp = document.getElementById('cliente-wpp').value.trim().replace(/\D/g, '');
  const nome = document.getElementById('cliente-nome').value.trim();
  const msg = document.getElementById('msg-cliente').value.replace('{{LINK_DOCS}}', docUrl);
  const canal = [...canais][0];

  if (!nome) { showStatus('Preencha o nome do cliente.', 'error'); return; }
  if ((canal === 'email' || canal === 'ambos') && !email) { showStatus('Preencha o e-mail do cliente.', 'error'); return; }
  if ((canal === 'wpp' || canal === 'ambos') && !wpp) { showStatus('Preencha o WhatsApp do cliente.', 'error'); return; }

  const btn = document.getElementById('btn-aprovar');
  const spinner = document.getElementById('btn-spinner');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true;
  spinner.style.display = 'inline-block';
  btnText.textContent = 'Enviando...';

  try {
    const resp = await fetch(PROXY + '/enviar-aprovacao-cliente', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ANON },
      body: JSON.stringify({ email, wpp, nome, msg, docUrl, semanaId, canal })
    });

    const data = await resp.json();
    if (data.success) {
      showStatus('✓ Conteúdo enviado ao cliente com sucesso!', 'success');
      btnText.textContent = '✅ Enviado!';
      if (semanaId) {
        await sb.from('semanas').update({ status: 'aguardando_aprovacao_cliente' }).eq('id', semanaId);
      }
    } else {
      throw new Error(data.error || 'Erro ao enviar');
    }
  } catch (e) {
    showStatus('Erro: ' + e.message, 'error');
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = '✅ Aprovar e enviar ao cliente';
  }
}
</script>
</body>
</html>
